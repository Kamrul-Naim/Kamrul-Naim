<svg width="1400" height="340" viewBox="0 0 1400 340" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E27"/>
      <stop offset="55%" stop-color="#130B33"/>
      <stop offset="100%" stop-color="#1E1147"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C5CFC" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7C5CFC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#45E6D8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#45E6D8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5F4FF"/>
      <stop offset="100%" stop-color="#C9C2FF"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <pattern id="dotGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#3A3570" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1400" height="340" fill="url(#bgGrad)"/>
  <rect width="1400" height="340" fill="url(#dotGrid)"/>

  <!-- ambient glows -->
  <circle cx="1080" cy="90" r="180" fill="url(#glowViolet)"/>
  <circle cx="1240" cy="260" r="160" fill="url(#glowCyan)"/>

  <!-- subtle top/bottom hairlines -->
  <rect x="0" y="0" width="1400" height="2" fill="#7C5CFC" opacity="0.35"/>
  <rect x="0" y="338" width="1400" height="2" fill="#45E6D8" opacity="0.25"/>

  <!-- ===== Left content block ===== -->
  <text x="70" y="98" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#45E6D8" opacity="0.9">const developer = {</text>

  <text x="70" y="168" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="url(#nameGrad)">Kamrul Hasan</text>

  <text x="70" y="206" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#B7B2E8">Full-Stack Developer &#183; MERN Stack &#183; Problem Solver</text>

  <text x="70" y="248" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#8F8AC7">
    <tspan fill="#45E6D8">stack</tspan>: [<tspan fill="#F5D76E">"React"</tspan>, <tspan fill="#F5D76E">"Node"</tspan>, <tspan fill="#F5D76E">"Express"</tspan>, <tspan fill="#F5D76E">"MongoDB"</tspan>],
  </text>
  <text x="70" y="276" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#8F8AC7">
    <tspan fill="#45E6D8">focus</tspan>: <tspan fill="#F5D76E">"building things that work"</tspan>
  </text>

  <text x="70" y="308" font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#45E6D8" opacity="0.9">};</text>

  <!-- ===== Right network / node graph motif ===== -->
  <g stroke="#5B54A6" stroke-width="1.4" opacity="0.7">
    <line x1="1060" y1="90" x2="1180" y2="60"/>
    <line x1="1060" y1="90" x2="1150" y2="170"/>
    <line x1="1180" y1="60" x2="1290" y2="110"/>
    <line x1="1150" y1="170" x2="1290" y2="110"/>
    <line x1="1150" y1="170" x2="1220" y2="250"/>
    <line x1="1290" y1="110" x2="1310" y2="220"/>
    <line x1="1220" y1="250" x2="1310" y2="220"/>
  </g>

  <g font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#D8D4FF">
    <circle cx="1060" cy="90" r="7" fill="#7C5CFC"/>
    <text x="1000" y="80">UI</text>

    <circle cx="1180" cy="60" r="7" fill="#45E6D8"/>
    <text x="1188" y="45">React</text>

    <circle cx="1150" cy="170" r="9" fill="#7C5CFC"/>
    <text x="1078" y="176">API</text>

    <circle cx="1290" cy="110" r="7" fill="#45E6D8"/>
    <text x="1298" y="100">Node</text>

    <circle cx="1220" cy="250" r="7" fill="#F5D76E"/>
    <text x="1150" y="270">Mongo</text>

    <circle cx="1310" cy="220" r="6" fill="#7C5CFC"/>
    <text x="1320" y="215">DB</text>
  </g>

  <!-- angle bracket motif, echoes code theme without being generic -->
  <text x="1370" y="330" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#5B54A6" opacity="0.8">&lt;/&gt; always shipping</text>
</svg>
